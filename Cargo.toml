[package]
name = "millarecs"
version = "0.1.0"
edition = "2024"
description = "Millarecs, Entity Component System"
rust-version = "1.95"
license = "MIT"
keywords = ["ecs", "game", "millarecs"]
categories = ["game-engines", "data-structures"]


[dependencies]
millarecs_macros = { path = "macros", version = "0.1.0" }

[workspace]
resolver = "2"
members = [".", "macros", "playground"]
default-members = ["."]